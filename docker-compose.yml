version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - redis
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    env_file: .env

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  db:
    image: postgis/postgis:15-3.3
    ports:
      - "5432:5432"
    env_file: .env
